name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.2 (AGP 8.2 needs Gradle 8.x, runners ship Gradle 9)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build release APK
        run: |
          gradle --version
          gradle assembleRelease --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/pahpad-shahed-v1.0.0.apk

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "1.0.0"
          files: out/pahpad-shahed-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
