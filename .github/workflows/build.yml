name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.2 (AGP 8.2 needs Gradle 8.x, runners ship Gradle 9)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Decode signing key
        env:
          KEY_B64: ${{ secrets.PAHPAD_UPLOAD_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.PAHPAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEY_B64" | base64 --decode > app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=hoda-upload\nkeyPassword=%s\n' "$KEY_PASS" "$KEY_PASS" > app/keystore.properties

      - name: Regression tests
        run: |
          gradle testDebugUnitTest --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g" --continue || true
          find app/build/test-results -name '*.xml' | while read f; do
            echo "===== $f"
            cat "$f"
          done
          gradle testDebugUnitTest --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g"

      - name: Build release APK
        run: |
          gradle --version
          gradle assembleRelease --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g"

      - name: Locate APK
        run: find app/build/outputs -name "*.apk"

      - name: Verify APK exists
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo 'No release APK was produced'; exit 1; }
          for apk in "${apks[@]}"; do
            bytes=$(stat -c '%s' "$apk")
            echo "$(basename "$apk"): $bytes bytes"
          done

      - name: Rename APK
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" out/pahpad-shahed-v0.0.7.apk

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.0.7
          name: "0.0.7"
          files: out/pahpad-shahed-v0.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  godot-flight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Godot Android export signs with apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools (apksigner/zipalign)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"

      - name: Setup Godot 4.3 + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.3-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          ls -lh "$HOME/.local/share/godot/export_templates/4.3.stable/" | head

      - name: Configure Godot editor settings (SDK path + debug keystore)
        run: |
          mkdir -p "$HOME/.android" "$HOME/.local/share/godot/editor"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_password = "android"'
          } > "$HOME/.local/share/godot/editor/editor_settings-4.tres"
          cat "$HOME/.local/share/godot/editor/editor_settings-4.tres"

      - name: Import project resources
        run: |
          /tmp/godot --headless --path spikes/godot-flight --import || true
          /tmp/godot --headless --path spikes/godot-flight --quit

      - name: Export Godot Android APK
        run: |
          mkdir -p out
          /tmp/godot --headless --path spikes/godot-flight --export-release "Android" /tmp/saffron-sky.apk
          ls -lh /tmp/saffron-sky.apk

      - name: Verify exported APK
        run: |
          unzip -l /tmp/saffron-sky.apk | grep -q AndroidManifest.xml || { echo 'Not an APK: AndroidManifest.xml missing'; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          "$APKSIGNER" verify --print-certs /tmp/saffron-sky.apk | head -20
          cp /tmp/saffron-sky.apk out/saffron-sky-v0.0.7-godot-flight.apk
          ls -lh out/

      - name: Release Godot flight APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.0.7-godot-flight
          name: "0.0.7-godot-flight (Saffron Sky)"
          files: out/saffron-sky-v0.0.7-godot-flight.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
