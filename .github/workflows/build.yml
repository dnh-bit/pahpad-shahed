name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      modded:
        description: 'همهٔ مراحل و پهبادها باز (بیلد تست)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.2 (AGP 8.2 needs Gradle 8.x, runners ship Gradle 9)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Read version
        id: ver
        run: |
          VN=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "name=$VN" >> $GITHUB_OUTPUT
          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "tag=v$VN+$VC" >> $GITHUB_OUTPUT
          echo "نسخه: $VN ($VC)"

      - name: Decode signing key
        env:
          KEY_B64: ${{ secrets.PAHPAD_UPLOAD_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.PAHPAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEY_B64" | base64 --decode > app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=hoda-upload\nkeyPassword=%s\n' "$KEY_PASS" "$KEY_PASS" > app/keystore.properties

      - name: Regression tests
        run: |
          gradle testDebugUnitTest --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g" --continue || true
          find app/build/test-results -name '*.xml' | while read f; do
            echo "===== $f"
            cat "$f"
          done
          gradle testDebugUnitTest --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g"

      - name: Build release APK
        run: |
          gradle --version
          gradle assembleRelease --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g"

      - name: Locate APK
        run: find app/build/outputs -name "*.apk"

      - name: Verify APK exists
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo 'No release APK was produced'; exit 1; }
          for apk in "${apks[@]}"; do
            bytes=$(stat -c '%s' "$apk")
            echo "$(basename "$apk"): $bytes bytes"
          done

      - name: Rename APK
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "out/pahpad-shahed-v${{ steps.ver.outputs.name }}.apk"

      - name: Build modded APK (all unlocked)
        if: ${{ inputs.modded == true }}
        run: |
          gradle clean assembleRelease -Pmodded=true --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g"
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "out/pahpad-v${{ steps.ver.outputs.name }}-test.apk"
          ls -la out/

      - name: Upload test results (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/**
          if-no-files-found: ignore

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body_path: CHANGES-${{ steps.ver.outputs.name }}-FA.md
          files: out/pahpad-shahed-v${{ steps.ver.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release modded (pre-release)
        if: ${{ inputs.modded == true }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.ver.outputs.tag }}-test
          name: ${{ steps.ver.outputs.name }} — نسخهٔ تست
          body: |
            🧪 **نسخهٔ تست — همهٔ مراحل و پهبادها باز**

            برای تست سریع گیم‌پلی. این نسخه:

            - همهٔ ۲۰ مرحله باز است
            - همهٔ ۴ پهباد باز است
            - شناسهٔ جدا (`ir.shahed.pahpad.mod`) دارد، پس کنار نسخهٔ اصلی نصب می‌شود
            - برچسب «نسخهٔ تست» روی هدر همهٔ صفحه‌ها دیده می‌شود

            ⚠️ برای انتشار عمومی استفاده نکن.
          prerelease: true
          files: out/pahpad-v${{ steps.ver.outputs.name }}-test.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

