name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.2 (AGP 8.2 needs Gradle 8.x, runners ship Gradle 9)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Decode signing key
        env:
          KEY_B64: ${{ secrets.PAHPAD_UPLOAD_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.PAHPAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEY_B64" | base64 --decode > app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=hoda-upload\nkeyPassword=%s\n' "$KEY_PASS" "$KEY_PASS" > app/keystore.properties

      - name: Regression tests
        run: |
          gradle testDebugUnitTest --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g" --continue || true
          find app/build/test-results -name '*.xml' | while read f; do
            echo "===== $f"
            cat "$f"
          done
          gradle testDebugUnitTest --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g"

      - name: Build release APK
        run: |
          gradle --version
          gradle assembleRelease --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g"

      - name: Locate APK
        run: find app/build/outputs -name "*.apk"

      - name: Verify APK exists
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo 'No release APK was produced'; exit 1; }
          for apk in "${apks[@]}"; do
            bytes=$(stat -c '%s' "$apk")
            echo "$(basename "$apk"): $bytes bytes"
          done

      - name: Rename APK
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" out/pahpad-shahed-v0.0.7.apk

      - name: Upload test results (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/**
          if-no-files-found: ignore

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.0.7
          name: "0.0.7"
          files: out/pahpad-shahed-v0.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

