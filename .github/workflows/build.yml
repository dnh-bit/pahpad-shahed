name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.2 (AGP 8.2 needs Gradle 8.x, runners ship Gradle 9)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Decode signing key
        env:
          KEY_B64: ${{ secrets.PAHPAD_UPLOAD_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.PAHPAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEY_B64" | base64 --decode > app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=hoda-upload\nkeyPassword=%s\n' "$KEY_PASS" "$KEY_PASS" > app/keystore.properties

      - name: Build release APK
        run: |
          gradle --version
          gradle assembleRelease --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g"

      - name: Locate APK
        run: find app/build/outputs -name "*.apk"

      - name: Rename APK
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" out/pahpad-shahed-v0.0.2.apk

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.0.2
          name: "0.0.2"
          files: out/pahpad-shahed-v0.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
